<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E2F24">
<meta name="color-scheme" content="dark">
<title>HQ | Digital with David K</title>
<link rel="icon" type="image/svg+xml" href="../images/brand/dk-beige.svg">
<link rel="apple-touch-icon" href="../images/brand/dk-beige.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js?v=1"></script>
<style>
:root{
  --emerald:#0E2F24;--beige:#C9B59C;--stone:#EDE6DC;
  --bg:#081c15;--panel:#0E2F24;--panel2:#123a2d;--line:#1f4a3b;
  --fg:#EDE6DC;--muted:#a9b3a9;--accent:#C9B59C;--ok:#9fd3b4;--warn:#e9c27a;--bad:#e59a8c;
  --r:16px;--tabh:66px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Montserrat,system-ui,sans-serif;font-size:15px;line-height:1.4}
body{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 90px);min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.hidden{display:none!important}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(8,28,21,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header img{height:26px;width:auto}
.htitle{flex:1;min-width:0}
.htitle b{display:block;font-size:11px;letter-spacing:.24em;color:var(--accent);font-weight:700}
.htitle span{font-size:12px;color:var(--muted)}
.ur{display:flex;gap:8px}
.ur button{min-width:64px;height:44px;border-radius:12px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;font-size:13px;padding:0 10px}
.ur button:disabled{opacity:.35;border-color:var(--line);color:var(--muted)}

main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px;font-weight:800}
h2{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin:22px 0 10px;font-weight:700}
.sub{color:var(--muted);font-size:13px;margin:0}

/* home */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tile b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.wait{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.wait button{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px;text-align:left;min-height:72px}
.wait button b{display:block;font-size:24px;font-weight:800}
.wait button.has{border-color:var(--accent)}
.wait button span{font-size:12px;color:var(--muted)}
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:56px;text-align:left;width:100%}
.task .box{width:28px;height:28px;border-radius:8px;border:2px solid var(--accent);flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--emerald)}
.task.on .box{background:var(--accent)}
.task.on .tl{text-decoration:line-through;color:var(--muted)}
.task .tl{font-weight:600}
.task small{display:block;color:var(--muted);font-weight:500;text-decoration:none}

/* approval */
.seg{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:13px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--emerald);border-color:var(--accent)}
.seg .n{margin-left:6px;font-size:11px;opacity:.85}
.selall{display:flex;align-items:center;gap:10px;margin:14px 0 10px;min-height:44px;background:none;border:0;padding:0;font-weight:700;color:var(--accent)}
.chk{width:30px;height:30px;border-radius:9px;border:2px solid var(--accent);flex:none;display:inline-flex;align-items:center;justify-content:center;color:var(--emerald);font-weight:800;background:transparent}
.chk.on{background:var(--accent)}
.cards{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.sel{border-color:var(--accent)}
.ctop{display:flex;gap:12px;align-items:flex-start}
.ctop .chk{margin-top:2px}
.who{font-weight:800;font-size:16px;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.pill.hot{background:var(--accent);color:var(--emerald)}
.pill.time{background:#3a2f12;color:var(--warn)}
.ctx{color:var(--muted);font-size:13px;margin:10px 0 0;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.ctx.open{-webkit-line-clamp:unset}
.draft{background:var(--bg);border-left:3px solid var(--accent);border-radius:10px;padding:10px 12px;margin-top:10px;white-space:pre-wrap;font-size:15px}
.trans{font-size:13px;color:var(--muted);margin-top:6px;white-space:pre-wrap}
.trans b{color:var(--accent)}
.acts{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:12px}
.btn{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--emerald)}
.btn.ghost{background:transparent}
textarea,input[type=url],input[type=text],input[type=password]{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
textarea{min-height:120px;margin-top:10px}
.empty{color:var(--muted);text-align:center;padding:36px 10px;background:var(--panel);border:1px dashed var(--line);border-radius:var(--r)}

/* bulk bar */
.bulk{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));z-index:25;padding:10px 16px;background:rgba(8,28,21,.97);border-top:1px solid var(--accent);display:grid;grid-template-columns:2fr 1fr;gap:8px;max-width:720px;margin:0 auto}
.bulk .btn{height:54px;font-size:15px}

/* brands */
.brand{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.bhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bname{font-size:18px;font-weight:800}
.bacct{font-size:13px;color:var(--muted);margin-top:2px}
.blogin{display:flex;align-items:center;justify-content:center;height:48px;border-radius:12px;background:var(--accent);color:var(--emerald);font-weight:800;text-decoration:none;margin-top:12px}
.blabel{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:14px 0 6px}
.dl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.dl li{background:var(--bg);border-radius:10px;padding:9px 11px;font-size:14px}
.dl li b{color:var(--accent);font-weight:700;margin-right:6px}
.pay{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px}
.bnote{font-size:13px;color:var(--muted);margin-top:8px}
.bfilt{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:14px -16px 10px;padding:0 16px}
.bfilt::-webkit-scrollbar{display:none}
.bfilt button{flex:none;height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:13px}
.bfilt button[aria-pressed=true]{background:var(--accent);color:var(--emerald);border-color:var(--accent)}
.bfilt .n{margin-left:6px;font-size:11px;opacity:.85}
.bsearch{margin:0 0 14px}
.bsearch input{height:46px;padding:0 14px}
.bmini{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.bmini>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:56px;cursor:pointer}
.bmini>summary::-webkit-details-marker{display:none}
.bmini>summary .mn{flex:1;min-width:0}
.bmini>summary b{display:block;font-size:15px;font-weight:800;word-break:break-word}
.bmini>summary small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bmini>summary:after{content:'+';color:var(--accent);font-weight:800;font-size:18px;flex:none}
.bmini[open]>summary:after{content:'\2212'}
.bmini .brand{border:0;border-top:1px solid var(--line);border-radius:0 0 14px 14px;margin:0}
.pill.act{background:#16402f;color:var(--ok)}.pill.cls{background:#3a1f1a;color:var(--bad)}

/* links */
.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kinds button{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700}
.kinds button[aria-pressed=true]{background:var(--accent);color:var(--emerald);border-color:var(--accent)}
.lrow{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;word-break:break-all}
.lrow .pill{margin-right:6px}

/* done */
.drow{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px}
.drow .st{font-weight:800}
.st.sent,.st.approved{color:var(--ok)}.st.skipped{color:var(--bad)}

/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#06150f;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{height:var(--tabh);background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);position:relative}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
nav button[aria-current=page]{color:var(--accent)}
nav .badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--accent);color:var(--emerald);border-radius:999px;font-size:10px;font-weight:800;min-width:18px;height:18px;line-height:18px;padding:0 5px}

/* lock + toast */
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.lockbox{width:100%;max-width:360px;text-align:center}
.lockbox img{height:56px;margin-bottom:18px}
.lockbox h1{margin-bottom:6px}
.lockbox input{margin-top:16px;text-align:center;letter-spacing:.2em}
.lockbox .btn{width:100%;margin-top:12px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 84px);z-index:40;max-width:520px;margin:0 auto;background:var(--stone);color:var(--emerald);border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast span{flex:1}
.toast button{background:var(--emerald);color:var(--stone);border:0;border-radius:10px;height:38px;padding:0 14px;font-weight:800}
.busy{position:fixed;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:45;background:var(--panel2);border:1px solid var(--accent);color:var(--accent);font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px}

/* globe (same look as /globe/, Nov 4) */
.hqg{max-width:720px;margin:0 auto;padding:0 16px 8px}
.hqg .gwrap{position:relative;width:100%;max-width:420px;margin:0 auto;aspect-ratio:1/1}
.hqg canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.hqg canvas.drag{cursor:grabbing}
.hqg .gload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.hqg .ghelp{text-align:center;font-size:12px;color:var(--muted);margin:4px 0 0}
.hqg .gopen{display:flex;align-items:center;justify-content:center;height:48px;border-radius:12px;border:1px solid var(--accent);color:var(--accent);font-weight:800;text-decoration:none;margin:12px auto 0;max-width:420px}
</style>
</head>
<body>

<div class="lock" id="lock">
  <div class="lockbox">
    <img src="../images/brand/dk-beige.svg" alt="Digital with David K">
    <h1 id="lockTitle">HQ</h1>
    <p class="sub" id="lockSub">Loading...</p>
    <form id="lockForm" class="hidden">
      <input type="password" id="pass1" autocomplete="current-password" placeholder="Passcode" inputmode="text">
      <input type="password" id="pass2" class="hidden" autocomplete="new-password" placeholder="Type it again">
      <button class="btn pri" id="lockBtn" type="submit">Open HQ</button>
      <div class="err" id="lockErr"></div>
    </form>
  </div>
</div>

<header>
  <a href="https://digitalwithdavidk.com/" aria-label="Digital with David K homepage" style="display:flex"><img src="../images/brand/dk-beige.svg" alt=""></a>
  <div class="htitle"><b>DIGITAL WITH DAVID K</b><span id="hsub">CEO Dashboard</span></div>
  <div class="ur">
    <button id="undoBtn" disabled aria-label="Undo last action">Undo</button>
    <button id="redoBtn" disabled aria-label="Redo">Redo</button>
  </div>
</header>

<section class="hqg hidden" style="padding-top:12px" id="hqGlobe" aria-label="The Globe">
    <div class="gwrap"><canvas id="hqGlobeCv" role="img" aria-label="Spinning globe. Gold countries are open on the Globe. Grey dots are in the vote."></canvas><div class="gload" id="hqGlobeLoad">Loading the globe</div></div>
  <p class="ghelp" id="hqGlobeHelp">Drag to spin. Tap a gold pin to open that trip.</p>
  <a class="gopen" href="../globe/" target="_blank" rel="noopener">Open the Globe</a>
</section>

<main id="view"></main>

<div class="bulk hidden" id="bulk">
  <button class="btn pri" id="bulkSend">Send 0 selected</button>
  <button class="btn" id="bulkSkip">Skip 0 selected</button>
</div>

<nav id="nav">
  <button data-v="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-v="approve"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/><path d="M8 10l2.5 2.5L16 8"/></svg>Approve<span class="badge hidden" id="navBadge"></span></button>
  <button data-v="brands"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="7" rx="2"/><rect x="13" y="4" width="8" height="7" rx="2"/><rect x="3" y="13" width="8" height="7" rx="2"/><rect x="13" y="13" width="8" height="7" rx="2"/></svg>Brands</button>
  <button data-v="links"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Links</button>
  <button data-v="done"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>Done</button>
</nav>

<div class="toast hidden" id="toast"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>
<div class="busy hidden" id="busy">Saving...</div>

<script>
(function(){
'use strict';
var API = (window.HQ_CONFIG && window.HQ_CONFIG.api) || '';
var TZ = 'America/Winnipeg';
var TABS = [['dms','DMs'],['ugc','UGC'],['clients','Clients'],['emails','Emails'],['comments','Comments']];
var MONEY = [
  ['film','Film','1+ video today'],
  ['main','Post main reel',''],
  ['trials','Post 5 trial reels',''],
  ['carousel','Post carousel',''],
  ['ugc','UGC','Film, edit or send brand videos'],
  ['calls','Calls','Take booked calls, book new ones']
];
var S = {data:null, view:'home', tab:'dms', sel:{}, editing:null, kind:'inspo', views30:null, vaultUpdated:'', bf:'active', bq:'', bopen:{}};

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function fmtWhen(iso){var d=new Date(iso);if(isNaN(d))return '';return new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(d);}
function num(n){return Number(n).toLocaleString('en-US');}
function hasTime(s){return /\b\d{1,2}(:\d{2})?\s?(am|pm)\b/i.test(s||'')||/\b(today|tomorrow|tonight)\b/i.test(s||'');}

function call(action, extra){
  var body = Object.assign({action:action, key:store('hq_key')||''}, extra||{});
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'})
    .then(function(r){return r.json();});
}

/* ---------- lock ---------- */
var setupMode=false;
function showLock(mode){
  $('lock').classList.remove('hidden');$('lockForm').classList.remove('hidden');
  setupMode = mode==='setup';
  $('lockTitle').textContent = setupMode?'Pick your HQ passcode':'HQ';
  $('lockSub').textContent = setupMode?'First time here. Pick a passcode (6+ characters). You type it once per phone.':'Type your passcode.';
  $('pass2').classList.toggle('hidden',!setupMode);
  $('lockBtn').textContent = setupMode?'Save passcode':'Open HQ';
  setTimeout(function(){$('pass1').focus();},50);
}
$('lockForm').addEventListener('submit',function(e){
  e.preventDefault();$('lockErr').textContent='';
  var p=$('pass1').value;
  if(setupMode){
    if(p.length<6){$('lockErr').textContent='Use at least 6 characters.';return;}
    if(p!==$('pass2').value){$('lockErr').textContent='The two passcodes do not match.';return;}
    call('setPasscode',{passcode:p}).then(function(r){
      if(!r.ok){$('lockErr').textContent=r.error||'Could not save.';return;}
      store('hq_key',p);load();
    }).catch(function(){$('lockErr').textContent='No connection. Try again.';});
  } else {
    store('hq_key',p);load(true);
  }
});

function load(fromLock){
  if(!API){$('lockSub').textContent='HQ backend is not connected yet.';$('lock').classList.remove('hidden');return;}
  call('get').then(function(r){
    if(r.ok){S.data=r;$('lock').classList.add('hidden');render();return;}
    if(r.error==='locked'){
      call('status').then(function(s){
        if(!s.passcodeSet){showLock('setup');}
        else{showLock('enter');if(fromLock)$('lockErr').textContent='Wrong passcode.';store('hq_key',null);}
      });
      return;
    }
    $('lockSub').textContent='Error: '+(r.error||'unknown');
  }).catch(function(){$('lockSub').textContent='Could not reach HQ. Check your connection and reload.';$('lock').classList.remove('hidden');});
}

/* ---------- actions ---------- */
var toastT;
function toast(msg,undo){
  $('toastMsg').textContent=msg;$('toastUndo').classList.toggle('hidden',!undo);
  $('toast').classList.remove('hidden');clearTimeout(toastT);
  toastT=setTimeout(function(){$('toast').classList.add('hidden');},5000);
}
function act(action, extra, msg, showUndo){
  $('busy').classList.remove('hidden');
  return call(action, extra).then(function(r){
    $('busy').classList.add('hidden');
    if(!r.ok){toast(r.error==='locked'?'Locked. Reload and type your passcode.':'Not saved: '+r.error,false);return r;}
    S.data=r;
    var m = msg || (r.result&&r.result.msg) || 'Saved';
    if(r.result&&r.result.alreadySent&&r.result.alreadySent.length) m+='. Already sent, cannot pull back: '+r.result.alreadySent.join(', ');
    toast(m, showUndo);render();return r;
  }).catch(function(){$('busy').classList.add('hidden');toast('No connection. Nothing changed.',false);});
}
function decide(ids, kind){
  var n=ids.length; if(!n)return;
  ids.forEach(function(id){delete S.sel[id];});
  var word = kind==='approve'?'Approved to send:':'Skipped';
  act(kind,{ids:ids}, word+' '+n+(n>1?' items':''), true);
}
$('undoBtn').onclick=function(){act('undo',{},null,false);};
$('redoBtn').onclick=function(){act('redo',{},null,false);};
$('toastUndo').onclick=function(){$('toast').classList.add('hidden');act('undo',{},null,false);};
$('bulkSend').onclick=function(){decide(selectedIds(),'approve');};
$('bulkSkip').onclick=function(){decide(selectedIds(),'skip');};
function selectedIds(){var w=waiting(S.tab).map(function(r){return r.id;});return Object.keys(S.sel).filter(function(id){return S.sel[id]&&w.indexOf(id)>=0;});}

/* ---------- data helpers ---------- */
function q(){return (S.data&&S.data.queue)||[];}
function waiting(tab){return q().filter(function(r){return r.status==='waiting'&&(!tab||r.tab===tab);}).sort(function(a,b){return (b.priority==='hot')-(a.priority==='hot')||String(a.createdAt).localeCompare(String(b.createdAt));});}
function tasksToday(){var s=S.data&&S.data.stats&&S.data.stats['tasks:'+today()];try{return s?JSON.parse(s.value):{};}catch(e){return {};}}

/* ---------- render ---------- */
function render(){
  var d=S.data;if(!d)return;
  $('undoBtn').disabled=!d.canUndo;$('undoBtn').title=d.undoLabel?('Undo '+d.undoLabel):'';
  $('redoBtn').disabled=!d.canRedo;
  var w=waiting().length;$('navBadge').textContent=w;$('navBadge').classList.toggle('hidden',!w);
  [].forEach.call(document.querySelectorAll('nav button'),function(b){if(b.dataset.v===S.view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  var v=$('view'), ae=document.activeElement, bqFocus=ae&&ae.id==='bq', bqPos=bqFocus?ae.selectionStart:0;
  if(S.view==='home')v.innerHTML=homeHTML();
  else if(S.view==='approve')v.innerHTML=approveHTML();
  else if(S.view==='brands')v.innerHTML=brandsHTML();
  else if(S.view==='links')v.innerHTML=linksHTML();
  else v.innerHTML=doneHTML();
  if(bqFocus&&$('bq')){var bi=$('bq');bi.focus();try{bi.setSelectionRange(bqPos,bqPos);}catch(x){}}
  showGlobe(S.view==='home');
  var sel=S.view==='approve'?selectedIds().length:0;
  $('bulk').classList.toggle('hidden',!sel);
  $('bulkSend').textContent='Send '+sel+' selected';$('bulkSkip').textContent='Skip '+sel+' selected';
}

/* Brand groups come from the paymentStatus column.
   Active: money moving or work due (paid, owed, withdraw, transfer, gift, not started...),
   plus "not agreed" deals with a live Decide step (not the old Oct 8 tracker rows),
   plus any brand with a waiting message. Closed: closed/lost/declined. Rest: waiting / pitched. */
var BF=[['active','Active'],['waiting','Waiting / pitched'],['closed','Closed'],['all','All']];
function brandGroup(br){
  var s=String(br.paymentStatus||'').toLowerCase().trim(), dl=String(br.deliverables||'');
  if(/^(closed|lost|declined|passed|dead|ended|cancel+ed|done)\b/.test(s))return 'closed';
  if(q().some(function(r){return r.status==='waiting'&&r.brand===br.id;}))return 'active';
  if(s==='not agreed')return (/^Decide \|/m.test(dl)&&!/Oct 8 tracker/.test(dl))?'active':'waiting';
  if(/(paid|owed|owe|withdraw|transfer|ongoing|not started|gift|signed|agreed|active|in progress|live|due)/.test(s))return 'active';
  return 'waiting';
}
function brandMatch(br,qs){if(!qs)return true;return (String(br.name||'')+' '+String(br.id||'')).toLowerCase().indexOf(qs)>=0;}
function brandSets(){
  var all=((S.data.brands)||[]).slice().sort(function(x,y){return Number(x.order)-Number(y.order);});
  var qs=S.bq.trim().toLowerCase(), c={active:0,waiting:0,closed:0,all:0}, list=[];
  all.forEach(function(br){var g=brandGroup(br);br._g=g;if(!brandMatch(br,qs))return;c[g]++;c.all++;if(S.bf==='all'||S.bf===g)list.push(br);});
  return {c:c,list:list};
}
function brandChipsHTML(c){return BF.map(function(f){return '<button data-bf="'+f[0]+'" aria-pressed="'+(S.bf===f[0])+'">'+f[1]+'<span class="n">'+c[f[0]]+'</span></button>';}).join('');}
function brandListHTML(list){
  if(!list.length)return '<div class="empty">'+(S.bq.trim()?'No brand matches "'+esc(S.bq.trim())+'" here.':'Nothing in this group.')+'</div>';
  var h='';
  list.forEach(function(br){
    if(br._g==='active'){h+=brandBoxHTML(br);return;}
    var next=String(br.deliverables||'').split('\n').filter(Boolean).pop()||'';
    next=next.split(' | ').slice(-1)[0];
    h+='<details class="bmini" data-bid="'+esc(br.id)+'"'+(S.bopen[br.id]?' open':'')+'><summary><span class="mn"><b>'+esc(br.name)+'</b>'+(next?'<small>'+esc(next)+'</small>':'')+'</span>';
    if(br.paymentStatus)h+='<span class="pill'+(br._g==='closed'?' cls':'')+'">'+esc(br.paymentStatus)+'</span>';
    h+='</summary>'+(S.bopen[br.id]?brandBoxHTML(br):'')+'</details>';
  });
  return h;
}
function brandsHTML(){

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('button,[data-ctx]');if(!t)return;
  if(t.closest('nav')){S.view=t.dataset.v;S.editing=null;render();window.scrollTo(0,0);return;}
  if(t.dataset.goto){S.view='approve';S.tab=t.dataset.goto;render();window.scrollTo(0,0);return;}
  if(t.dataset.tab){S.tab=t.dataset.tab;S.sel={};S.editing=null;render();return;}
  if(t.hasAttribute('data-ctx')){t.classList.toggle('open');return;}
  if(t.dataset.bf){S.bf=t.dataset.bf;refreshBrandList();return;}
  if(t.dataset.task){var on=!tasksToday()[t.dataset.task];act('task',{date:today(),task:t.dataset.task,done:on},on?'Nice. Ticked.':'Unticked',false);return;}
  if(t.dataset.kind){S.kind=t.dataset.kind;[].forEach.call(document.querySelectorAll('[data-kind]'),function(b){b.setAttribute('aria-pressed',b.dataset.kind===S.kind);});return;}
  if(t.hasAttribute('data-selall')){var list=waiting(S.tab),all=list.every(function(r){return S.sel[r.id];});list.forEach(function(r){S.sel[r.id]=!all;});render();return;}
  if(t.dataset.sel){S.sel[t.dataset.sel]=!S.sel[t.dataset.sel];render();return;}
  var card=t.closest('.card');if(!card)return;var id=card.dataset.id;
  if(t.dataset.do==='approve')decide([id],'approve');
  else if(t.dataset.do==='skip')decide([id],'skip');
  else if(t.dataset.do==='edit'){S.editing=id;render();var b=$('editBox');if(b){b.focus();}}
  else if(t.dataset.save){
    if(t.dataset.save==='cancel'){S.editing=null;render();return;}
    var txt=$('editBox').value;S.editing=null;delete S.sel[id];
    act('edit',{id:id,text:txt,approve:t.dataset.save==='send'},t.dataset.save==='send'?'Edited and sent':'Edit saved',true);
  }
});
document.addEventListener('input',function(e){if(e.target.id==='bq'){S.bq=e.target.value;refreshBrandList();}});
document.addEventListener('toggle',function(e){
  var d=e.target;if(!d.dataset||!d.dataset.bid)return;var id=d.dataset.bid;
  if(d.open){S.bopen[id]=true;if(!d.querySelector('.brand')){var br=((S.data.brands)||[]).filter(function(x){return x.id===id;})[0];if(br){br._g=brandGroup(br);d.insertAdjacentHTML('beforeend',brandBoxHTML(br));}}}
  else delete S.bopen[id];
},true);
document.addEventListener('submit',function(e){
  if(e.target.id!=='linkForm')return;e.preventDefault();
  var url=$('linkUrl').value.trim(),note=$('linkNote').value.trim();
  act('addLink',{url:url,kind:S.kind,note:note},'Link saved',false);
});

    if(x+w>W-4)x=Math.min(xy[0]-12-w,W-4-w);if(x<4)x=side===2?4:xy[0]+12;
    var bx=[x,y,w,h];
    if(!live){var t=[bx,[xy[0]-12-w,y,w,h],[xy[0]+12,y,w,h],[xy[0]-w/2,xy[1]-h-9,w,h],[xy[0]-w/2,xy[1]+9,w,h]];bx=null;
      for(var i=0;i<t.length;i++){var c=t[i];if(c[0]<4||c[0]+c[2]>W-4)continue;if(!boxes.some(function(b){return hit(c,b);})){bx=c;break;}}if(!bx)return;}
    boxes.push(bx);ctx.globalAlpha=live?1:.85;ctx.fillStyle=live?'#C9B59C':'rgba(3,16,11,.85)';rr(bx[0],bx[1],w,h,h/2);ctx.fill();
    ctx.fillStyle=live?'#0E2F24':'#C0C0C0';ctx.textBaseline='middle';ctx.fillText(txt,bx[0]+7,bx[1]+h/2+.5);ctx.globalAlpha=1;}
  function draw(t){
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(bg,0,0);ctx.setTransform(dpr,0,0,dpr,0,0);proj.rotate(rot);
    ctx.beginPath();path(grat);ctx.strokeStyle='rgba(237,230,220,.08)';ctx.lineWidth=.7;ctx.stroke();
    ctx.beginPath();path(land);ctx.fillStyle='#2f4a40';ctx.fill();
    GPL.forEach(function(p){if(!p.f||p.live||p.name==='Bali')return;ctx.beginPath();path(p.f);ctx.fillStyle='rgba(192,192,192,.3)';ctx.fill();});
    ctx.shadowColor='rgba(201,181,156,.8)';ctx.shadowBlur=12;ctx.fillStyle='#C9B59C';
    GPL.forEach(function(p){if(!p.f||!p.live)return;ctx.beginPath();path(p.f);ctx.fill();});ctx.shadowBlur=0;
    ctx.beginPath();path(borders);ctx.strokeStyle='rgba(237,230,220,.22)';ctx.lineWidth=.5;ctx.stroke();
    ctx.beginPath();ctx.arc(W/2,W/2,R,0,7);ctx.strokeStyle='rgba(201,181,156,.5)';ctx.lineWidth=1.2;ctx.stroke();
    var fs=Math.max(10,Math.round(W/40)),boxes=[];
    GPL.filter(function(p){return !p.live;}).concat(GPL.filter(function(p){return p.live;})).forEach(function(p){
      if(!vis(p)){p.xy=null;return;}var xy=proj([p.lon,p.lat]);p.xy=xy;
      if(p.live){var ph=GRED?0:((t/1400)+(p.id%7)/7)%1;
        ctx.beginPath();ctx.arc(xy[0],xy[1],7+ph*18,0,7);ctx.strokeStyle='rgba(237,230,220,'+(0.8*(1-ph))+')';ctx.lineWidth=2;ctx.stroke();
        ctx.beginPath();ctx.arc(xy[0],xy[1],7,0,7);ctx.fillStyle='#FFFFFF';ctx.shadowColor='#EDE6DC';ctx.shadowBlur=16;ctx.fill();ctx.shadowBlur=0;
        ctx.beginPath();ctx.arc(xy[0],xy[1],3.2,0,7);ctx.fillStyle='#0E2F24';ctx.fill();
      }else{ctx.beginPath();ctx.arc(xy[0],xy[1],4.5,0,7);ctx.fillStyle='#8E8E94';ctx.fill();ctx.strokeStyle='#03100b';ctx.lineWidth=1.5;ctx.stroke();}
      boxes.push([xy[0]-7,xy[1]-7,14,14]);});
    GPL.forEach(function(p){if(p.live&&p.xy)label(p.xy,p.name.toUpperCase(),true,fs*.9,p.side||1,boxes);});
    GPL.forEach(function(p){if(!p.live&&p.xy)label(p.xy,p.name.toUpperCase(),false,fs*.85,p.side||1,boxes);});
  }
  function frame(t){if(!running)return;
    if(!dragging){if(Math.abs(vel)>.01){rot[0]+=vel;vel*=.93;}else if(!GRED&&t-idleAt>2500)rot[0]+=.12;}
    draw(t);raf=requestAnimationFrame(frame);}
  HG.pause=function(){running=false;cancelAnimationFrame(raf);};
  HG.resume=function(){if(!HG.on||document.hidden)return;size();if(!running){running=true;raf=requestAnimationFrame(frame);}};
  var last=null,moved=0;
  cv.addEventListener('pointerdown',function(e){last=[e.clientX,e.clientY];moved=0;dragging=true;vel=0;cv.classList.add('drag');try{cv.setPointerCapture(e.pointerId);}catch(x){}});
  cv.addEventListener('pointermove',function(e){
    if(!dragging||!last||!R){var r0=cv.getBoundingClientRect(),x0=e.clientX-r0.left,y0=e.clientY-r0.top;cv.style.cursor=GPL.some(function(p){return p.live&&p.xy&&Math.hypot(p.xy[0]-x0,p.xy[1]-y0)<26;})?'pointer':'';return;}
    var dx=e.clientX-last[0],dy=e.clientY-last[1];moved+=Math.abs(dx)+Math.abs(dy);var k=90/R;rot[0]+=dx*k;rot[1]=Math.max(-70,Math.min(70,rot[1]-dy*k));vel=dx*k;last=[e.clientX,e.clientY];});
  function end(e){if(!dragging)return;dragging=false;cv.classList.remove('drag');idleAt=performance.now();if(moved<8&&e.type==='pointerup')tap(e);last=null;}
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  function tap(e){var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,best=null,bd=26;
    GPL.forEach(function(p){if(!p.live||!p.xy)return;var d=Math.hypot(p.xy[0]-x,p.xy[1]-y);if(d<bd){bd=d;best=p;}});
    if(!best){var ll=proj.invert([x,y]);if(ll&&Math.hypot(x-W/2,y-W/2)<R)GPL.forEach(function(p){if(p.live&&p.f&&d3.geoContains(p.f,ll))best=p;});}
    if(best)window.open('../globe/#'+best.key,'_blank','noopener');}
  if('IntersectionObserver' in window)new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting)HG.resume();else HG.pause();});}).observe(cv);
  document.addEventListener('visibilitychange',function(){if(document.hidden)HG.pause();else HG.resume();});
  window.addEventListener('resize',function(){if(cv.clientWidth&&cv.clientWidth!==W){size();draw(performance.now());}});
  $('hqGlobeLoad').classList.add('hidden');HG.ready=true;HG.resume();
}

/* 30-day views from the Content Vault */
fetch('../vault/data.json?t='+Date.now()).then(function(r){return r.json();}).then(function(v){
  var cut=new Date(Date.now()-30*864e5).toISOString().slice(0,10),sum=0;
  (v.posts||[]).forEach(function(p){if(String(p.posted)>=cut)sum+=Number(p.views)||0;});
  S.views30=sum;S.vaultUpdated=v.updated||'';if(S.view==='home')render();
}).catch(function(){S.views30=null;});

load();
setInterval(function(){if(document.visibilityState==='visible'&&S.data&&!S.editing&&!selectedIds().length)call('get').then(function(r){if(r.ok){S.data=r;render();}}).catch(function(){});},60000);
})();
